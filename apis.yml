name: Citruslabs
description: Citruslabs is a clinical research organization (CRO) that designs and runs clinical trials,
  consumer perception studies, and randomized controlled trials for consumer health brands across
  supplements, skincare, pet health, food and beverage, longevity, and women's health. It handles IRB
  approval, protocol design, participant recruitment, decentralized data collection, and statistical
  analysis, then turns results into regulator-reviewed, marketing-ready product claims for retailers,
  advertising, and packaging. Studies range from DIY consumer perception studies to full randomized
  controlled trials, typically completing in four to sixteen weeks.
